<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="../static/css/style.css">
    <style>

        body {
    display: flex;
    flex-direction: column;
    align-items: center;
}
        
        .flashcard-container {
            perspective: 1000px;
            width: 400px;
            height: 300px;
            margin: 20px;
        }
        
        #flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        
        #flashcard.flipping {
            transition: transform 0.6s;
        }
        
        #flashcard.flipped {
            transform: rotateY(180deg);
        }
        
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid black;
            box-shadow: 0px 4px 0px black;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            background-color: rgb(62, 62, 114);
            color: rgb(221, 221, 243);
        }
        
        .card-back {
            transform: rotateY(180deg);
            background-color: white;
            color: black;
        }
        
    </style>

</head>
<body>
    <a href="/dashboard" class="positive">< Back to Dashboard</a>
    <div id="counter"></div>
    
    <div class="flashcard-container">
        <div id="flashcard">
            <div class="card-face card-front">
                <h2 id="frontText"></h2>
            </div>
            <div class="card-face card-back">
                <h2 id="backText"></h2>
            </div>
        </div>
    </div>
    
    <div>
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
        <input type="checkbox" id="flipToggle">
        <label for="flipToggle">Flip questions and answers</label>
    </div>
    
    <script>
        // Sample data - replace with: const flashcardsData = {{ flashcards | tojson }};
        const flashcardsData = {{ flashcards | tojson }};
        
        let currentIndex = 0;
        let isFlipped = false;
        let flipQA = false;
        
        const flashcard = document.getElementById('flashcard');
        const frontText = document.getElementById('frontText');
        const backText = document.getElementById('backText');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const flipToggle = document.getElementById('flipToggle');
        
        function updateCard(animate = false) {
            const card = flashcardsData[currentIndex];
            
            // Determine what shows on front and back based on flipQA setting
            if (flipQA) {
                frontText.textContent = card[1]; // Answer on front
                backText.textContent = card[0];  // Question on back
            } else {
                frontText.textContent = card[0]; // Question on front
                backText.textContent = card[1];  // Answer on back
            }
            
            counterEl.textContent = `Card ${currentIndex + 1} of ${flashcardsData.length}`;
            
            // Reset to front side (no animation)
            if (!animate) {
                flashcard.classList.remove('flipping', 'flipped');
                isFlipped = false;
            }
        }
        
        flashcard.addEventListener('click', () => {
            // Enable animation for manual flips
            flashcard.classList.add('flipping');
            
            if (isFlipped) {
                flashcard.classList.remove('flipped');
            } else {
                flashcard.classList.add('flipped');
            }
            
            isFlipped = !isFlipped;
        });
        
        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard(false);
            }
        });
        
        nextBtn.addEventListener('click', () => {
            if (currentIndex < flashcardsData.length - 1) {
                currentIndex++;
                updateCard(false);
            }
        });
        
        flipToggle.addEventListener('change', () => {
            flipQA = flipToggle.checked;
            updateCard(false);
        });
        
        updateCard(false);
    </script>
</body>
</html>
